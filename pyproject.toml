[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "microns-finder"
version = "0.1.0"
description = "Find cells in the MICrONS mouse visual cortex EM dataset by type, layer and area, and open them in Neuroglancer, from any AI (MCP server, CLI, Python)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jorge Sanz-Ros" }]
keywords = ["connectomics", "MICrONS", "neuroglancer", "CAVE", "electron microscopy", "cell types", "mcp", "ai-agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "caveclient>=8.0",
    "nglui>=4.5",
    "standard_transform>=2.0",
    "pandas>=2.0",
    # pyarrow 26 refuses to import with NumPy 1.x but doesn't declare numpy>=2, so pip can pair
    # them and the tool crashes. NumPy 1.x only exists up to Python 3.12, so the cap stops there.
    "pyarrow>=14,<26; python_version < '3.13'",
    "pyarrow>=14; python_version >= '3.13'",
    "pyyaml>=6",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
microns-finder = "microns_finder.cli:main"
microns-finder-mcp = "microns_finder.mcp_server:main"

[project.urls]
Homepage = "https://github.com/jsanzros/microns-neuroglancer-finder"

[tool.hatch.build.targets.wheel]
packages = ["src/microns_finder"]

[tool.hatch.build.targets.wheel.force-include]
"skills/find-cells/SKILL.md" = "microns_finder/skills/find-cells/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs network access and a CAVE token (run with: pytest -m live)"]
addopts = "-m 'not live'"

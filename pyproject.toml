[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "microns-finder"
version = "0.1.0"
description = "Find cells in the MICrONS mouse visual cortex EM dataset by type, layer and area, and open them in Neuroglancer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jorge Sanz-Ros" }]
keywords = ["connectomics", "MICrONS", "neuroglancer", "CAVE", "electron microscopy", "cell types"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "caveclient>=8.0",
    "nglui>=4.5",
    "standard_transform>=2.0",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
microns-finder = "microns_finder.cli:main"

[project.urls]
Homepage = "https://github.com/jsanzros/microns-finder"

[tool.hatch.build.targets.wheel]
packages = ["src/microns_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs network access and a CAVE token (run with: pytest -m live)"]
addopts = "-m 'not live'"
